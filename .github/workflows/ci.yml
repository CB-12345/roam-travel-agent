name: local-agent-regression
on: [push, pull_request, workflow_dispatch]
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    env:
      LLM_ENABLED: 'false'
      AMAP_API_KEY: ''
      QWEATHER_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt -c requirements.lock.txt
      - run: python scripts/check_release.py
      - run: python -m pytest -q tests
      - run: node --test tests/frontend/*.test.cjs
      - run: python scripts/evaluate.py --output evals/ci-report.json
      - run: for file in static/*.js; do node --check "$file"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-replay-${{ matrix.python }}
          path: evals/ci-report.json
